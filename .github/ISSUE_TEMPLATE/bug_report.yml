name: Bug report
description: Something isn't working as expected
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search existing issues first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Added a 4K .mov to the queue
        2. Applied "Apple ProRes 422 HQ"
        3. Started the queue -> status "Failed: ..."
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Error log
      description: Paste the relevant entry from **Help → Show Error Log** (includes the FFmpeg command and output).
      render: text
  - type: textarea
    id: source
    attributes:
      label: Source media
      description: Format, codec, resolution and frame rate of the source (right-click a source → **Source Media Info…**).
  - type: input
    id: version
    attributes:
      label: Open Media Encoder version
      description: Shown in **Help → About**.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Package
      options:
        - Installer
        - Portable zip
        - Built from source
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows version and GPU
      placeholder: "Windows 11 24H2, NVIDIA RTX 4070 (driver 576.57)"
