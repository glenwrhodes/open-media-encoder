name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  QT_VERSION: '6.10.2'

jobs:
  build:
    name: Windows (${{ matrix.toolchain }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # MinGW builds the shipped packages.
          - toolchain: mingw
            qt_arch: win64_mingw
            qt_tools: 'tools_mingw1310,qt.tools.win64_mingw1310'
            package: true
          # MSVC keeps the code building with the toolchain most Windows contributors use.
          - toolchain: msvc
            qt_arch: win64_msvc2022_64
            qt_tools: ''
            package: false

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: ${{ matrix.qt_arch }}
          tools: ${{ matrix.qt_tools }}
          aqtversion: '==3.3.*'
          cache: true

      - name: Use Qt's MinGW toolchain
        if: matrix.toolchain == 'mingw'
        shell: pwsh
        run: |
          $bin = Join-Path $env:IQTA_TOOLS "mingw1310_64\bin"
          if (-not (Test-Path "$bin\g++.exe")) { throw "MinGW not found at $bin" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CXX=$bin\g++.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Use MSVC
        if: matrix.toolchain == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install Inno Setup
        if: matrix.package
        run: choco install innosetup --no-progress -y

      - name: Package
        if: matrix.package
        shell: pwsh
        run: ./scripts/package.ps1 -BuildDir build -OutDir dist -Installer

      - name: Upload packages
        if: matrix.package
        uses: actions/upload-artifact@v4
        with:
          name: OpenMediaEncoder-windows-x64
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04 # oldest supported glibc: packages built here run on 22.04+ and similar
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgl1-mesa-dev libegl1 \
            libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libx11-xcb1 fonts-dejavu-core

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: desktop
          arch: linux_gcc_64
          aqtversion: '==3.3.*'
          cache: true

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-linux
          key: ffmpeg-linux-x86_64-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}

      - name: Fetch FFmpeg
        run: ./scripts/fetch-ffmpeg.sh

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: ./scripts/package-linux.sh build dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenMediaEncoder-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  macos:
    # Not packaged yet: keeps the code building and passing tests on macOS (Apple silicon).
    name: macOS (build and test)
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          aqtversion: '==3.3.*'
          cache: true

      - name: Install Ninja
        run: brew install ninja

      - name: Cache FFmpeg
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg-macos
          key: ffmpeg-macos-arm64-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}

      - name: Fetch FFmpeg
        run: ./scripts/fetch-ffmpeg.sh

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: OpenMediaEncoder-*
          path: dist
          merge-multiple: true

      - name: Checksums for all packages
        run: |
          cd dist
          rm -f SHA256SUMS*.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Check tag matches project version
        run: |
          version=$(grep -m1 -oP '^\s+VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Write release notes
        run: |
          {
            echo "## Downloads"
            echo
            echo "| File | Description |"
            echo "| --- | --- |"
            echo "| \`OpenMediaEncoder-${VERSION}-win64-setup.exe\` | **Installer** (recommended): Start menu entry and uninstaller |"
            echo "| \`OpenMediaEncoder-${VERSION}-win64-portable.zip\` | **Windows, portable**: unzip anywhere and run \`OpenMediaEncoder.exe\` |"
            echo "| \`OpenMediaEncoder-${VERSION}-x86_64.AppImage\` | **Linux**: \`chmod +x\` the file and run it |"
            echo "| \`OpenMediaEncoder-${VERSION}-linux-x86_64.tar.gz\` | **Linux, unpacked**: extract and run \`open-media-encoder\` (no FUSE needed) |"
            echo
            echo "FFmpeg is included; nothing else to install. Windows 10/11 x64, or 64-bit Linux with glibc 2.35+"
            echo "(Ubuntu 22.04, Debian 12, Fedora 36 or newer). Verify downloads with \`SHA256SUMS.txt\`."
            echo
            awk -v v="$VERSION" '
              /^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } }
              found' CHANGELOG.md
          } > notes.md
          cat notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Open Media Encoder ${{ env.VERSION }}
          body_path: notes.md
          files: |
            dist/*.zip
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
